name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Android SDK（Build Tools 34 / Platform 34）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKM" ]; then echo "✗ 没找到 sdkmanager"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: 准备 ~/android-build 工具链目录
        run: |
          mkdir -p "$HOME/android-build"
          ln -sfn "$ANDROID_SDK_ROOT" "$HOME/android-build/sdk"
          ln -sfn "$JAVA_HOME" "$HOME/android-build/jdk"
      - name: 校验 tag 与 version.json 一致
        run: |
          v="$(node scripts/version.mjs version)"
          if [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "✗ tag ${GITHUB_REF_NAME} 与 version.json 的 $v 不一致"; exit 1
          fi
      - name: 测试与版本校验
        run: |
          node scripts/version.mjs check
          npm test
      - name: 构建 Windows 包
        run: bash scripts/build-windows.sh
      - name: 构建 Android 包
        run: bash scripts/build-android-linux.sh
      - name: 构建 Web 包
        run: |
          npm run build
          cd dist
          zip -qr -X "SkyPond-$(node ../scripts/version.mjs version)-Web.zip" \
            index.html style.css core.js art.js gl.js scene.js audio.js app.js project.json assets -x '*.DS_Store'
      - name: 生成校验和
        run: cd dist && sha256sum SkyPond-*.zip SkyPond-*.apk > SHA256SUMS.txt
      - name: 准备发布说明
        run: |
          f="docs/release-notes-$(node scripts/version.mjs version).md"
          if [ ! -f "$f" ]; then
            printf '# %s\n\n半亩方塘自动构建版本。\n' "$GITHUB_REF_NAME" > "$f"
          fi
          echo "NOTES=$f" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: 半亩方塘 ${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
          files: |
            dist/SkyPond-*.zip
            dist/SkyPond-*.apk
            dist/SHA256SUMS.txt
