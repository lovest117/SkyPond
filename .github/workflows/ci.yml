name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 版本号一致性（以 version.json 为准）
        run: node scripts/version.mjs check
      - name: 单元测试
        run: npm test
      - name: 静态构建
        run: npm run build

  packages:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装 Android Build Tools 与 Platform 34
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: 准备 ~/android-build 工具链目录
        run: |
          mkdir -p "$HOME/android-build"
          ln -sfn "$ANDROID_HOME" "$HOME/android-build/sdk"
          ln -sfn "$JAVA_HOME" "$HOME/android-build/jdk"
      - name: 构建 Windows 包
        run: bash scripts/build-windows.sh
      - name: 构建 Android 包
        run: bash scripts/build-android-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPond-packages
          path: |
            dist/SkyPond-*-Windows.zip
            dist/SkyPond-*-Android.apk
          if-no-files-found: error
